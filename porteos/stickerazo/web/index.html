<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14121c">
<title>Stickerazo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="estilo.css">
<script>/* (el modo claro u oscuro, antes de pintar: sin flash) */try{var t=localStorage.getItem('sz_tema')||'oscuro';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'claro':'oscuro';document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>
<div id="app">
  <!-- inicio: crear y los packs -->
  <section id="vInicio" class="vista">
    <header class="cab cabInicio"><div class="logo"><span>Sticker</span><b>azo</b></div><button class="botonMusica" id="botonMusica" aria-label="Música">🎵</button></header>
    <div class="contenido" id="tabFeed">
      <div id="tirar" class="tirar"><div class="rueda"></div></div>
      <button class="buscarFalso" id="irBuscar"><i data-i="lupa"></i><span>Buscá memes, packs, emojis…</span></button>
      <div class="paisCard oc" id="paisCard"></div>
      <button class="eventoCard oc" id="eventoCard"></button>
      <div class="historias" id="historias"></div>
      <div class="banners" id="banners"></div>
      <div class="seg" id="feedSeg"><button data-m="para-vos" class="act">Para vos</button><button data-m="nuevos">Recién salidos</button><button data-m="siguiendo">Seguidos</button></div>
      <div id="feedLista" class="feedLista"></div>
    </div>
    <div class="contenido oc" id="tabCrear">
      <div class="portada" id="portada"><span class="saludo">¿Qué stickers hacemos hoy?</span></div>
      <button id="bCrear" class="grande"><i data-i="mas"></i>Crear sticker</button>
      <div class="dos"><button id="bTexto" class="sec"><i data-i="texto"></i>Sólo texto</button><button id="bCamara" class="sec"><i data-i="camara"></i>Sacar foto</button></div>
      <button id="bExpress" class="express"><span class="rayo">⚡</span><span><b>Pack express</b><small>Elegí hasta 30 fotos: te armo el pack entero</small></span></button>
      <h2>Packs listos <small>· se pueden cambiar</small></h2>
      <div id="carrusel" class="carrusel"></div>
      <div class="ventajas"><span>🔒 Las fotos no salen de tu celular</span><span>🚫 Sin marca de agua</span><span>✏️ Todo se puede volver a editar</span></div>
    </div>
    <div class="contenido oc" id="tabListos">
      <div class="buscar"><i data-i="lupa"></i><input id="qBuscar" type="search" placeholder="Buscá: mate, jaja, fútbol, 😂…" autocomplete="off" enterkeyhint="search"></div>
      <div id="resCom"></div>
      <div id="resBuscar"></div>
      <div id="listos" class="listos"></div>
    </div>
    <div class="contenido oc" id="tabMios">
      <h2 style="margin-top:8px">Mis packs</h2>
      <div id="packs" class="packs"></div>
    </div>
    <div class="contenido oc" id="tabPerfil"></div>
    <nav class="tabs" id="tabs">
      <button data-t="Feed"><i data-i="casa"></i>Inicio</button><button data-t="Listos"><i data-i="lupa"></i>Buscar</button><button data-t="Crear" class="centro" aria-label="Crear"><span><i data-i="mas"></i></span></button><button data-t="Mios"><i data-i="carpeta"></i>Mis packs</button><button data-t="Perfil"><i data-i="persona"></i>Perfil</button>
    </nav>
  </section>
  <!-- recortar la foto -->
  <section id="vRecorte" class="vista oc">
    <header class="cab"><button class="ico volver" aria-label="Volver"><i data-i="atras"></i></button><h1>Recortá</h1><button id="rSig" class="pri">Siguiente</button></header>
    <div class="lienzoCont" id="rCont"><canvas id="rLienzo"></canvas><div id="rGira" class="gira oc"><div class="rueda"></div><span>Recortando…</span></div></div>
    <div class="modos" id="rModos">
      <button data-m="auto"><span>✨</span>Auto</button><button data-m="cara"><span>🙂</span>Solo cara</button><button data-m="cabezon"><span>🎈</span>Cabezón</button><button data-m="entera"><span>🖼️</span>Entera</button>
    </div>
    <p id="rAyuda" class="ayuda"></p>
    <div class="pincel oc" id="rPincelCont"><i data-i="punto"></i><input type="range" id="rPincel" min="6" max="70" value="26" aria-label="Tamaño del pincel"><i data-i="puntoG"></i></div>
    <nav class="barra" id="rHerr">
      <button data-h="tocar"><i data-i="dedo"></i>Tocar</button>
      <button data-h="borrar"><i data-i="goma"></i>Borrar</button>
      <button data-h="recuperar"><i data-i="pincel"></i>Recuperar</button>
      <button data-h="deshacer"><i data-i="deshacer"></i>Deshacer</button>
    </nav>
  </section>
  <!-- decorar: mover, texto, emojis, borde -->
  <section id="vEditor" class="vista oc">
    <header class="cab"><button class="ico volver" aria-label="Volver"><i data-i="atras"></i></button><h1>Decorá</h1><button id="eGuardar" class="pri">Guardar</button></header>
    <div class="lienzoCont"><canvas id="eLienzo"></canvas></div>
    <p class="ayuda" id="eAyuda">Arrastrá para mover · con dos dedos agrandás y girás</p>
    <nav class="barra">
      <button data-e="texto"><i data-i="texto"></i>Texto</button>
      <button data-e="emoji"><i data-i="cara"></i>Emoji</button>
      <button data-e="animar"><i data-i="anim"></i>Animar</button>
      <button data-e="borde"><i data-i="borde"></i>Borde</button>
      <button data-e="xd"><i class="icoXD">xD</i>xD</button>
      <button data-e="ajustes"><i data-i="ajustes"></i>Ajustes</button>
      <button data-e="borrar"><i data-i="tacho"></i>Sacar</button>
    </nav>
  </section>
  <!-- un pack -->
  <section id="vPack" class="vista oc">
    <header class="cab"><button class="ico volver" aria-label="Volver"><i data-i="atras"></i></button><h1 id="pNombre">Pack</h1><b id="pTipo" class="insignia oc">Animado</b><button class="ico" id="pMenu" aria-label="Opciones del pack"><i data-i="puntos"></i></button></header>
    <div class="contenido">
      <div id="pGrilla" class="grilla"></div>
      <p id="pFalta" class="ayuda"></p>
      <button id="pPublicar" class="publicar"><i data-i="nube"></i><span>Publicar en la comunidad</span></button>
      <button id="pCompletar" class="completar oc"><i data-i="copias"></i><span>Completar</span></button>
    </div>
    <footer class="pie">
      <button id="pWhats" class="whats"><i data-i="whats"></i><span>Agregar a WhatsApp</span></button>
      <div class="dos"><button id="pMas" class="sec"><i data-i="mas"></i>Otro sticker</button><button id="pCompartir" class="sec"><i data-i="compartir"></i>Compartir</button></div>
    </footer>
  </section>
  <!-- un pack de la comunidad -->
  <section id="vPublico" class="vista oc">
    <header class="cab"><button class="ico volver" aria-label="Volver"><i data-i="atras"></i></button><h1 id="puNombre"></h1><button class="ico" id="puMenu" aria-label="Más"><i data-i="puntos"></i></button></header>
    <div class="contenido" id="puCont"></div>
    <footer class="pie">
      <button id="puWhats" class="whats"><i data-i="whats"></i><span>Agregar a WhatsApp</span></button>
      <div class="dos"><button id="puLike" class="sec mgG"><i data-i="corazon"></i><span>Me gusta</span></button><button id="puCompartir" class="sec"><i data-i="compartir"></i>Compartir</button></div>
    </footer>
  </section>
  <!-- un perfil -->
  <section id="vUsuario" class="vista oc">
    <header class="cab"><button class="ico volver" aria-label="Volver"><i data-i="atras"></i></button><h1 id="usNombre"></h1><button class="ico" id="usMenu" aria-label="Más"><i data-i="puntos"></i></button></header>
    <div class="contenido" id="usCont"></div>
  </section>
</div>
<div id="modal" class="modal oc" role="dialog" aria-modal="true"></div>
<div id="aviso" class="aviso oc" role="status"></div>
<input type="file" id="archivo" accept="image/*" hidden>
<input type="file" id="archivoCam" accept="image/*" capture="environment" hidden>
<input type="file" id="archivoVarios" accept="image/*" multiple hidden>
<script type="module" src="app.js"></script>
  <canvas id="liquido" class="liquido oc" aria-hidden="true"></canvas>
</body>
</html>
