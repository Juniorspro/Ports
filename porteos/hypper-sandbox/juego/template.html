<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<title>RezoBox</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Roboto,Arial,Helvetica,sans-serif;color:#fff;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#toque{position:fixed;inset:0;z-index:1}
.oc{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud .bt{pointer-events:auto}
.redondo{width:44px;height:44px;border-radius:50%;background:rgba(40,52,70,.55);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.redondo img{width:26px;height:26px;object-fit:contain}
.redondo small{position:absolute;bottom:-11px;left:0;right:0;text-align:center;font-size:8px;opacity:.85}
#arribaIz{position:absolute;left:10px;top:8px;display:flex;gap:14px}
#arribaDe{position:absolute;right:10px;top:8px;display:flex;gap:14px;align-items:flex-start}
#armaAct{width:56px;text-align:center;font-size:9px}
#armaAct img{width:52px;height:30px;object-fit:contain;background:rgba(40,52,70,.55);border-radius:4px;display:block}
#muni{position:absolute;right:14px;top:62px;font-size:12px;font-weight:bold;text-shadow:0 1px 2px #000}
#barra{position:absolute;right:10px;top:6px;display:flex;gap:4px}
#barra .ra{width:44px;height:40px;background:rgba(40,52,70,.6);border:2px solid transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;pointer-events:auto}
#barra .ra img{width:38px;height:24px;object-fit:contain}
#barra .ra.sel{border-color:#6be06b}
#vida{position:absolute;left:0;bottom:0;width:150px;height:18px;background:#9b1b1b;display:flex;align-items:center;font-size:11px;font-weight:bold}
#vida i{position:absolute;left:0;top:0;bottom:0;background:#e53030}
#vida img{width:14px;height:14px;margin:0 6px;position:relative}
#vida span{position:relative;margin-left:auto;margin-right:8px}
#fps{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:11px;opacity:.75;text-shadow:0 1px 2px #000}
#mira{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.9}
#mira:before,#mira:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}
#mira:before{left:8px;top:2px;width:2px;height:14px}
#mira:after{top:8px;left:2px;height:2px;width:14px}
#aviso{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .3s}
#aviso.ve{opacity:1}
#usarTxt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:13px;text-shadow:0 1px 3px #000}
/* táctil */
#tactil{display:none}
body.tactil #tactil{display:block}
#palanca{position:absolute;width:120px;height:120px;left:40px;bottom:40px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);pointer-events:none;opacity:.6}
#palanca.activa{opacity:1}
#palbola{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
.bt-t{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(40,52,70,.55);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;pointer-events:auto;font-size:10px;font-weight:bold}
.bt-t img{width:32px;height:32px;object-fit:contain}
.bt-t.ap{background:rgba(120,140,170,.7)}
#bdisparo{right:22px;bottom:110px;width:76px;height:76px}
#bsaltar{right:110px;bottom:30px}
#bagachar{right:190px;bottom:22px;width:50px;height:50px}
#brecargar{right:110px;bottom:110px;width:50px;height:50px}
#busar{right:30px;bottom:24px;width:56px;height:56px}
#bdisp2{right:110px;bottom:180px;width:50px;height:50px}
#brotar{right:22px;bottom:200px;width:50px;height:50px}
#blejos{right:180px;bottom:180px;width:44px;height:44px}
#bcerca{right:180px;bottom:120px;width:44px;height:44px}
/* menú de spawn (como el del juego) */
#spawn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(var(--vw)*94));height:min(500px,calc(var(--vh)*86));z-index:5;display:flex;flex-direction:column}
#spawn .tabs{display:flex;gap:2px;height:28px}
#spawn .tab{background:#3b3d42;color:#ddd;font-size:12px;padding:0 10px;display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:3px 3px 0 0}
#spawn .tab img{height:16px;width:auto}
#spawn .tab.sel{background:#4a4c52;color:#fff}
#spawn .cuerpo{flex:1;display:flex;background:#3a3a3a;border:4px solid #4a4c52;min-height:0}
#spawn .cats{width:150px;background:#f2f2f2;color:#222;overflow:auto;padding:4px 0}
#spawn .cat{font-size:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;cursor:pointer}
#spawn .cat:before{content:'';width:14px;height:11px;background:#e8b84a;border-radius:2px;display:inline-block}
#spawn .cat.sel{background:#d5dbe6}
#spawn .grilla{flex:1;overflow:auto;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
#spawn .it{width:62px;cursor:pointer;text-align:center;font-size:8.5px;color:#ddd;padding:2px;border-radius:3px}
#spawn .it:hover,#spawn .it:active{background:#555}
#spawn .it img{width:58px;height:44px;object-fit:contain;display:block;margin:0 auto 2px}
#spawn .pie{height:26px;background:#3a3a3a;font-size:11px;display:flex;align-items:center;gap:16px;padding:0 8px;border-top:1px solid #4a4c52}
#spawn .pie label{display:flex;align-items:center;gap:4px}
#spawn .pie input{margin:0}
#spawn .cerrar{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:34px;height:34px}
#spawn .herr{flex:1;display:flex;min-width:0}
#spawn .ins{width:220px;background:#2f3034;padding:8px;font-size:12px;overflow:auto}
#spawn .ins h4{margin:0 0 6px;font-size:13px}
#spawn .ins label{display:block;margin:6px 0 2px;color:#bbb}
#spawn .ins input,#spawn .ins select{width:100%;background:#1f2024;color:#fff;border:1px solid #555;padding:4px;font-size:12px}
/* paneles */
.panel{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.caja{background:#2a2c31;border-radius:6px;padding:16px;min-width:260px;max-width:calc(var(--vw)*94);max-height:calc(var(--vh)*90);overflow:auto}
.caja h3{margin:0 0 12px;font-size:16px}
.boton{display:block;width:100%;margin:6px 0;padding:10px;background:#3e6fd8;border:0;color:#fff;font-size:14px;border-radius:4px;cursor:pointer;font-weight:bold}
.boton.gris{background:#4b4e56}
.boton.chico{display:inline-block;width:auto;padding:6px 10px;margin:3px;font-size:12px}
.host{padding:6px 10px;font-size:13px;color:#ddd}.host h4{margin:10px 0 4px;font-size:13px;color:#fff}
.hFila{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}.hFila input[type=range]{flex:1;min-width:120px}.hFila input[type=number]{width:70px}
.hJ{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:rgba(255,255,255,.06);border-radius:3px;margin:2px 0}
body.sinUI #hud>*:not(#mira){visibility:hidden}
.fila{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.fila select,.fila input[type=range]{flex:1}
/* menú principal: el LobbyCanvas del juego (menu.js) */
:root{--vw:1vw;--vh:1vh}
html.rot body{position:fixed;left:0;top:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
#menuReal{position:fixed;inset:0;z-index:5;overflow:hidden}
/* HypperX RezoBox: inicio con el aspecto del menú de Garry's Mod (tamaños por la altura real del juego: --vh) */
#rbInicio{position:fixed;inset:0;z-index:5;overflow:hidden;background:#000;font-family:Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#rbInicio.oc,#rbInicio .oc{display:none}
.rbBg{position:absolute;inset:0;background:#1a1d24 center/cover;opacity:0;transition:opacity 1.8s;animation:rbKen 26s linear infinite alternate}
.rbBg.on{opacity:1}
@keyframes rbKen{from{transform:scale(1.02)}to{transform:scale(1.13) translateX(-1.6%)}}
.rbSombra{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.12) 40%,rgba(0,0,0,0) 60%),linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0) 22%)}
.rbLogo{position:absolute;inset-inline-start:4.5%;top:calc(var(--vh)*6.5);height:calc(var(--vh)*10.5);max-width:60%;object-fit:contain;object-position:left}
.rbLista{position:absolute;inset-inline-start:4.5%;top:calc(var(--vh)*26);display:flex;flex-direction:column;align-items:flex-start}
.rbIt{font:700 calc(var(--vh)*4.7) Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;background:none;border:0;padding:calc(var(--vh)*.55) 0;cursor:pointer;text-align:start;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.45);transition:transform .12s,text-shadow .12s}
.rbIt:hover,.rbIt:active{transform:translateX(5px);text-shadow:0 0 12px rgba(255,255,255,.55),0 1px 2px #000}
.rbSep{height:calc(var(--vh)*3.6)}
.rbAbajo{position:absolute;inset-inline-start:1.6%;bottom:calc(var(--vh)*2.4);display:flex;gap:6px;align-items:center}
.rbChipG{display:flex;align-items:center;gap:6px;font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:calc(var(--vh)*1.3) 10px;cursor:pointer}
.rbChipG input{width:calc(var(--vh)*22);font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#fff;background:transparent;border:0;outline:none}
.rbVer{position:absolute;inset-inline-end:1.6%;bottom:calc(var(--vh)*2.4);font:500 calc(var(--vh)*2.6) Roboto,Arial,sans-serif;text-shadow:0 1px 2px #000;opacity:.85}
.rbPan{position:absolute;top:calc(var(--vh)*5);bottom:calc(var(--vh)*5);left:4%;right:4%;background:#e8e8e8;color:#222;border-radius:5px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.rbPanCab{display:flex;align-items:baseline;gap:12px;padding:calc(var(--vh)*1.8) 16px;background:#fafafa;border-bottom:1px solid #c9c9c9;font:800 calc(var(--vh)*4.2) Roboto,Arial,sans-serif}
.rbPanCab small{font:600 calc(var(--vh)*2.8) Roboto,Arial,sans-serif;color:#777}
.rbPanCuerpo{flex:1;display:flex;min-height:0}
.rbCats{width:22%;min-width:110px;background:#d6d6d6;padding:8px;display:flex;flex-direction:column;gap:4px;overflow:auto;border-right:1px solid #c4c4c4}
.rbCat{display:flex;justify-content:space-between;font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#333;background:#ececec;border:0;border-radius:3px;padding:calc(var(--vh)*1.4) 10px;text-align:left;cursor:pointer}
.rbCat em{font-style:normal;opacity:.55}
.rbCat.sel{background:#3d3d3d;color:#fff}
.rbGrid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--vh)*25),1fr));gap:12px;align-content:start}
.rbMapaG{cursor:pointer;text-align:center;border-radius:4px;padding:5px;border:2px solid transparent}
.rbMapaG .rbFoto{aspect-ratio:1;background:#999 center/cover;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.rbMapaG b{display:block;font:700 calc(var(--vh)*2.9) Roboto,Arial,sans-serif;margin-top:5px;color:#333}
.rbMapaG.sel{border-color:#2f86de;background:rgba(47,134,222,.14)}
.rbModsG{grid-template-columns:repeat(auto-fill,minmax(calc(var(--vh)*55),1fr))}
.rbModG{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #c9c9c9;border-radius:4px;padding:calc(var(--vh)*1.6) 10px;cursor:pointer}
.rbModG>i{font-style:normal;font-size:calc(var(--vh)*6);width:1.4em;text-align:center}
.rbModG span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.rbModG b{font-size:calc(var(--vh)*3.4)}.rbModG small{font-size:calc(var(--vh)*2.6);color:#666}
.rbModG em{width:calc(var(--vh)*4.6);height:calc(var(--vh)*4.6);border:2px solid #888;border-radius:3px;background:#fff;flex:none;position:relative}
.rbModG.on{border-color:#2f86de;background:#eef5fd}.rbModG.on em{background:#2f86de;border-color:#2f86de}
.rbModG.on em::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:900 calc(var(--vh)*3.4) Arial,sans-serif}
.rbPanPie{display:flex;align-items:center;gap:10px;padding:calc(var(--vh)*1.6) 14px;background:#f4f4f4;border-top:1px solid #c9c9c9;flex-wrap:wrap}
.rbEsp{flex:1}
.rbCampo{display:flex;align-items:center;gap:6px;font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#444}
.rbCampo select{font:600 calc(var(--vh)*3) Roboto,Arial,sans-serif;padding:calc(var(--vh)*.8) 6px;border:1px solid #aaa;border-radius:3px;background:#fff;color:#222}
.rbModo{font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#555}
.rbBtnG{font:800 calc(var(--vh)*3.6) Roboto,Arial,sans-serif;color:#fff;background:linear-gradient(#56a7ef,#2c7ccc);border:0;border-radius:4px;padding:calc(var(--vh)*1.8) 24px;cursor:pointer;box-shadow:0 2px 0 #1d5a96}
.rbBtnGris{font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#333;background:linear-gradient(#fdfdfd,#e1e1e1);border:1px solid #b5b5b5;border-radius:4px;padding:calc(var(--vh)*1.5) 14px;cursor:pointer}
/* bienvenida (idioma y nombre) */
.rbPan_bienvenida{top:calc(var(--vh)*4);bottom:calc(var(--vh)*4);left:12%;right:12%}
.rbBienv{flex:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--vh)*1.8);padding:calc(var(--vh)*3) 16px;overflow:auto}
.rbBienvLogo{height:calc(var(--vh)*9);box-sizing:content-box;padding:calc(var(--vh)*1.6) calc(var(--vh)*4);background:linear-gradient(#2c323c,#1b1f26);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rbBienv h2{margin:0;font:900 calc(var(--vh)*4.6) Roboto,Arial,sans-serif;text-align:center}
.rbSub{font:700 calc(var(--vh)*3) Roboto,Arial,sans-serif;color:#666}
.rbIdiomas{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--vh)*34),1fr));gap:6px;width:100%}
.rbIdi{display:flex;align-items:center;gap:8px;font:700 calc(var(--vh)*3.1) Roboto,Arial,sans-serif;color:#222;background:#fff;border:1px solid #c9c9c9;border-radius:4px;padding:calc(var(--vh)*1.4) 10px;cursor:pointer}
.rbIdi i{font-style:normal;font-size:calc(var(--vh)*4.4)}.rbIdi.sel{border-color:#2f86de;background:#e6f0fb;box-shadow:inset 0 0 0 1px #2f86de}
.rbNomB input{font:700 calc(var(--vh)*3.4) Roboto,Arial,sans-serif;padding:calc(var(--vh)*1.2) 8px;border:1px solid #aaa;border-radius:3px;width:calc(var(--vh)*40)}
/* tienda */
.rbTabs{display:flex;gap:4px;margin-inline-start:10px}
.rbTab{font:800 calc(var(--vh)*3.3) Roboto,Arial,sans-serif;color:#333;background:#e2e2e2;border:1px solid #c6c6c6;border-radius:4px 4px 0 0;padding:calc(var(--vh)*1.2) 14px;cursor:pointer}
.rbTab.sel{background:#3d3d3d;color:#fff;border-color:#3d3d3d}
.rbChico{font-size:calc(var(--vh)*2.9);padding:calc(var(--vh)*1.2) 12px}
.rbBarra{display:flex;gap:8px;align-items:center;padding:calc(var(--vh)*1.4) 14px;background:#efefef;border-bottom:1px solid #d0d0d0;flex-wrap:wrap}
.rbBarra input[type=search]{flex:1;min-width:120px;font:600 calc(var(--vh)*3.1) Roboto,Arial,sans-serif;padding:calc(var(--vh)*1.2) 10px;border:1px solid #aaa;border-radius:3px}
.rbBarra select,.rbForm select{font:600 calc(var(--vh)*3) Roboto,Arial,sans-serif;padding:calc(var(--vh)*1) 6px;border:1px solid #aaa;border-radius:3px;background:#fff}
.rbSeg{display:flex}.rbSeg button{font:700 calc(var(--vh)*2.9) Roboto,Arial,sans-serif;background:#fff;border:1px solid #aaa;padding:calc(var(--vh)*1.1) 10px;cursor:pointer;color:#333}
.rbSeg button:first-child{border-radius:3px 0 0 3px}.rbSeg button:last-child{border-radius:0 3px 3px 0;border-inline-start:0}.rbSeg button.sel{background:#3d3d3d;color:#fff;border-color:#3d3d3d}
.rbEtqs{display:flex;gap:5px;flex-wrap:wrap;padding:calc(var(--vh)*1) 14px 0}
.rbForm .rbEtqs{padding:4px 0 0}
.rbEtq{font:700 calc(var(--vh)*2.6) Roboto,Arial,sans-serif;color:#444;background:#fff;border:1px solid #bbb;border-radius:12px;padding:calc(var(--vh)*.7) 10px;cursor:pointer}
.rbEtq.sel{background:#2f86de;border-color:#2f86de;color:#fff}
.rbTiendaG{grid-template-columns:repeat(auto-fill,minmax(calc(var(--vh)*62),1fr))}
.rbCard{display:flex;gap:10px;background:#fff;border:1px solid #c9c9c9;border-radius:4px;padding:8px;min-width:0}
.rbCard.on{border-color:#2f86de;box-shadow:inset 0 0 0 1px #2f86de}
.rbIco{flex:none;width:calc(var(--vh)*13);height:calc(var(--vh)*13);display:flex;align-items:center;justify-content:center;font-size:calc(var(--vh)*8);background:#f1f1f1;border-radius:4px;overflow:hidden}
.rbIco img{width:100%;height:100%;object-fit:cover}
.rbCardMapa .rbIco{width:calc(var(--vh)*22)}
.rbInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rbInfo b{font:800 calc(var(--vh)*3.3) Roboto,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbInfo small{font:600 calc(var(--vh)*2.5) Roboto,Arial,sans-serif;color:#777}.rbOf{color:#2f86de}
.rbInfo p{margin:0;font:500 calc(var(--vh)*2.6) Roboto,Arial,sans-serif;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rbEtqsC i{font:700 calc(var(--vh)*2.2) Roboto,Arial,sans-serif;font-style:normal;color:#2f6fb0;background:#e8f1fb;border-radius:8px;padding:1px 6px;margin-inline-end:3px}
.rbAcc{flex:none;display:flex;flex-direction:column;gap:5px;align-items:stretch;justify-content:center}
.rbChk{display:flex;align-items:center;gap:6px;font:700 calc(var(--vh)*2.7) Roboto,Arial,sans-serif;color:#333;background:#f5f5f5;border:1px solid #bbb;border-radius:3px;padding:calc(var(--vh)*1) 8px;cursor:pointer}
.rbChk em{width:calc(var(--vh)*3.6);height:calc(var(--vh)*3.6);border:2px solid #888;border-radius:3px;background:#fff;position:relative;flex:none}
.rbChk.on{border-color:#2f86de;background:#eef5fd}.rbChk.on em{background:#2f86de;border-color:#2f86de}
.rbChk.on em::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:900 calc(var(--vh)*2.6) Arial,sans-serif}
.rbMini{display:flex;gap:4px;justify-content:center}.rbMini button{font:700 calc(var(--vh)*3) Arial,sans-serif;background:#f1f1f1;border:1px solid #c4c4c4;border-radius:3px;width:calc(var(--vh)*6.2);height:calc(var(--vh)*6.2);cursor:pointer;color:#555}
.rbMini button.sel{color:#e0245e}
.rbVacio{grid-column:1/-1;text-align:center;font:700 calc(var(--vh)*3.1) Roboto,Arial,sans-serif;color:#777;padding:20px}.rbVacio a{color:#2f86de;cursor:pointer;text-decoration:underline}
.rbTotal{font:700 calc(var(--vh)*2.8) Roboto,Arial,sans-serif;color:#777}
.rbMapaG small{display:block;font:600 calc(var(--vh)*2.4) Roboto,Arial,sans-serif;color:#777}
/* crear mod / publicar mapa */
.rbForm{flex:1;display:flex;gap:16px;padding:12px 16px;overflow:auto;min-height:0}
.rbCol{flex:1;display:flex;flex-direction:column;gap:calc(var(--vh)*1.6);min-width:0}
.rbForm .rbCampo{flex-direction:column;align-items:stretch;gap:4px}

<script>
// intro procedural (sin video): chispas, el aro cromado de JXStudios que se dibuja con un brillo que lo recorre,
// el monograma, los nombres y al final el logo de HypperX RezoBox. Con el teléfono parado se dibuja girada 90°
// (salvo que la página ya esté girada por CSS). Se saltea tocando (lo maneja el juego cuando está listo).
(function () {
  var c = document.getElementById('carga'), cv = document.getElementById('introCv'), x = cv.getContext('2d'), I = window.__intro = { fin: false };
  var logo = document.getElementById('rbLogoIntro'), t0 = 0, DUR = 5.8, chispas = [];
  for (var i = 0; i < 140; i++) chispas.push({ a: Math.random() * 6.283, d: 1.6 + Math.random() * 1.8, v: 0.55 + Math.random() * 0.5, s: 0.6 + Math.random() * 1.6, r: 0.75 + Math.random() * 0.5 });
  function fin() { if (!I.fin) { I.fin = true; c.classList.add('introFin'); if (I.cb) I.cb(); } }
  var cl = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; }, eo = function (v) { v = cl(v); return 1 - Math.pow(1 - v, 3); };
  function cromo(cx, cy, r, giro) {
    var g;
    if (x.createConicGradient) { g = x.createConicGradient(giro, cx, cy); [['#fff', 0], ['#7d8590', .12], ['#e9edf2', .25], ['#4a5059', .38], ['#ffffff', .5], ['#8a929c', .63], ['#dfe4ea', .76], ['#454b53', .88], ['#fff', 1]].forEach(function (p) { g.addColorStop(p[1], p[0]); }); }
    else { g = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, '#fff'); g.addColorStop(.5, '#6c737c'); g.addColorStop(1, '#eef1f4'); }
    return g;
  }
  function cuadro(ms) {
    if (!t0) t0 = ms; var t = (ms - t0) / 1000;
    var dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.clientWidth * dpr | 0, H = cv.clientHeight * dpr | 0;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    var girar = H > W * 1.05 && !document.documentElement.classList.contains('rot');
    if (girar) { x.translate(W, 0); x.rotate(Math.PI / 2); var tmp = W; W = H; H = tmp; }
    var cx = W / 2, cy = H * 0.44, R = Math.min(W, H) * 0.3, f1 = cl((3.9 - t) / 0.4) * cl(t / 0.2);
    if (f1 > 0) {
      x.globalAlpha = f1;
      // chispas que caen hacia el aro
      x.globalCompositeOperation = 'lighter';
      chispas.forEach(function (p) { var k = eo(t * p.v), d = R * (p.d + (p.r - p.d) * k), a = p.a + k * 1.2, al = cl(1 - k) * 0.9 + 0.1 * cl(1.2 - t);
        x.fillStyle = 'rgba(190,215,255,' + al.toFixed(3) + ')'; x.beginPath(); x.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, p.s * dpr, 0, 6.283); x.fill(); });
      x.globalCompositeOperation = 'source-over';
      // disco negro y aro cromado que se dibuja
      var ka = eo((t - 0.25) / 0.9), giro = t * 1.4;
      x.fillStyle = '#050607'; x.beginPath(); x.arc(cx, cy, R * 0.9 * eo((t - 0.6) / 0.6), 0, 6.283); x.fill();
      x.lineWidth = R * 0.13; x.strokeStyle = cromo(cx, cy, R, giro); x.shadowColor = 'rgba(160,200,255,.65)'; x.shadowBlur = R * 0.12 * (0.6 + 0.4 * Math.sin(t * 3));
      x.beginPath(); x.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + 6.283 * ka); x.stroke(); x.shadowBlur = 0;
      x.lineWidth = R * 0.018; x.strokeStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.arc(cx, cy, R * 0.93, -Math.PI / 2, -Math.PI / 2 + 6.283 * ka); x.stroke();
      // monograma JXS con contorno cromado y el nombre
      var km = eo((t - 1.0) / 0.6);
      if (km > 0) {
        x.save(); x.globalAlpha = f1 * km; x.translate(cx, cy - R * 0.12); x.scale(0.85 + 0.15 * km, 0.85 + 0.15 * km);
        x.font = '900 ' + (R * 0.62 | 0) + 'px "Arial Black",Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
        x.lineWidth = R * 0.07; x.strokeStyle = cromo(0, 0, R * 0.5, giro + 1); x.strokeText('JXS', 0, 0); x.fillStyle = '#050607'; x.fillText('JXS', 0, 0);
        x.lineWidth = R * 0.012; x.strokeStyle = 'rgba(255,255,255,.8)'; x.strokeText('JXS', 0, 0); x.restore();
      }
      var kn = eo((t - 1.6) / 0.5);
      if (kn > 0) { x.globalAlpha = f1 * kn; x.fillStyle = '#eef2f6'; x.font = '700 ' + (R * 0.2 | 0) + 'px Roboto,Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('JXStudios', cx, cy + R * 0.42); }
      // brillo que cruza el aro
      var kb = cl((t - 1.9) / 0.8);
      if (kb > 0 && kb < 1) { x.save(); x.globalAlpha = f1 * Math.sin(kb * Math.PI) * 0.7; x.beginPath(); x.arc(cx, cy, R * 1.07, 0, 6.283); x.clip();
        var bx = cx - R * 1.3 + kb * R * 2.6, gb = x.createLinearGradient(bx - R * 0.3, 0, bx + R * 0.3, 0); gb.addColorStop(0, 'rgba(255,255,255,0)'); gb.addColorStop(.5, 'rgba(255,255,255,.9)'); gb.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = gb; x.globalCompositeOperation = 'lighter'; x.fillRect(cx - R * 1.2, cy - R * 1.2, R * 2.4, R * 2.4); x.restore(); }
      // — JXSTUDIOS — abajo, con las líneas que se abren
      var kl = eo((t - 2.2) / 0.6);
      if (kl > 0) { x.globalAlpha = f1 * kl; var yb = cy + R * 1.45, tam = R * 0.17; x.font = '800 ' + (tam | 0) + 'px Roboto,Arial,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
        var txt = 'J X S T U D I O S', an = x.measureText(txt).width; x.fillStyle = '#e8edf3'; x.fillText(txt, cx, yb);
        x.strokeStyle = 'rgba(200,225,255,.9)'; x.lineWidth = Math.max(1, R * 0.012); x.shadowColor = 'rgba(160,200,255,.8)'; x.shadowBlur = R * 0.05;
        var lar = R * 0.55 * kl; x.beginPath(); x.moveTo(cx - an / 2 - R * 0.1, yb); x.lineTo(cx - an / 2 - R * 0.1 - lar, yb); x.moveTo(cx + an / 2 + R * 0.1, yb); x.lineTo(cx + an / 2 + R * 0.1 + lar, yb); x.stroke(); x.shadowBlur = 0; }
      x.globalAlpha = 1;
    }
    // el logo de HypperX RezoBox, con rebote y un brillo
    var kr = cl((t - 3.9) / 0.35) * cl((DUR - t) / 0.4);
    if (kr > 0 && logo.complete && logo.naturalWidth) {
      var e = eo((t - 3.9) / 0.5), lw = Math.min(W * 0.78, H * 1.9 * 0.26 * logo.naturalWidth / logo.naturalHeight), lh = lw * logo.naturalHeight / logo.naturalWidth, s = 0.9 + 0.1 * e + 0.04 * Math.sin(Math.min(1, (t - 3.9) / 0.5) * Math.PI);
      x.globalAlpha = kr; x.save(); x.translate(cx, H * 0.5); x.scale(s, s); x.drawImage(logo, -lw / 2, -lh / 2, lw, lh); x.restore(); x.globalAlpha = 1;
    }
    if (t >= DUR) { fin(); return; }
    if (c.classList.contains('salir')) return; // salteada
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
  setTimeout(fin, (DUR + 2.5) * 1000); // por si la pestaña no dibuja
})();
</script>
