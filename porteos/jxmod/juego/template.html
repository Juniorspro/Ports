<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1d22">
<title>JXMod</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Roboto,Arial,Helvetica,sans-serif;color:#fff;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#toque{position:fixed;inset:0;z-index:1}
.oc{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud .bt{pointer-events:auto}
/* Cíclope: el botón (tocar: láser; mantener 1 s: definitiva, con el aro que se llena), el tinte rojo y el rojo del que recibe el rayo */
#cicBt{position:absolute;right:26px;bottom:120px;width:68px;height:68px;border-radius:50%;background:rgba(60,10,14,.62);border:2px solid rgba(255,90,80,.45);display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
body.tactil #cicBt{right:24px;bottom:calc(262px*var(--hk,1));width:calc(62px*var(--hk,1));height:calc(62px*var(--hk,1))}
#cicBt img.ico{width:38px;height:38px;border-radius:9px;pointer-events:none}
#cicBt small{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;opacity:.85;color:#fff;pointer-events:none}
#cicBt .cicAro{position:absolute;left:-5px;top:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg);pointer-events:none}
#cicBt .cicAro circle{fill:none;stroke-width:4;stroke:rgba(255,255,255,.1)}
#cicBt .cicAro .cicCarga{stroke:#ff3b30;stroke-dasharray:182.2;stroke-dashoffset:182.2;stroke-linecap:round}
#cicBt.carga{background:rgba(150,16,10,.8);box-shadow:0 0 20px rgba(255,40,20,.65)}
#cicBt.ya{opacity:.45}
#cicBt .cicEsp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:bold 19px Roboto,Arial,sans-serif;color:#fff;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.45);border-radius:50%;pointer-events:none}
#cicBt .cicEsp:empty{display:none}
body.cicCine #mira,body.cicCine #tactil,body.cicCine #usarTxt{visibility:hidden}
#cicRojo{position:fixed;inset:0;pointer-events:none;background:#ff5236;mix-blend-mode:multiply;z-index:1;display:none}
#cicCiego{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,70,40,.8) 0%,rgba(205,12,6,.95) 58%,#5a0000 100%);z-index:1;display:none}
/* Verity: su botón (tocar: panel; mantener: micrófono), el panel de charla, el globo sobre ella y el velo de la noche */
#verBt{position:absolute;right:26px;bottom:200px;width:62px;height:62px;border-radius:50%;background:rgba(60,48,8,.6);border:2px solid rgba(255,214,60,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 14px rgba(255,200,40,.25)}
#verBt img.ico{width:62%;height:62%;border-radius:9px;pointer-events:none}
#verBt small{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;opacity:.85;color:#fff;pointer-events:none}
body.tactil #verBt small{display:none}
#verBt.oye{background:rgba(200,40,40,.75);border-color:#ff8a80;animation:verLate 1s infinite}
@keyframes verLate{50%{box-shadow:0 0 0 8px rgba(255,80,80,.25)}}
.verBurb{position:absolute;left:0;top:0;max-width:min(300px,70vw);width:max-content;padding:7px 12px;border-radius:14px;background:rgba(255,250,224,.95);color:#2b1c04;font:600 14px/1.3 Roboto,Arial,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.35);pointer-events:none;margin-top:-10px;white-space:normal}
.verBurb::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:rgba(255,250,224,.95)}
.verBurb.oscura{background:rgba(14,6,8,.92);color:#ffb3a6;font-style:italic;letter-spacing:.3px}
.verBurb.oscura::after{border-top-color:rgba(14,6,8,.92)}
.verPiensa{display:inline-flex;gap:4px;align-items:center;height:14px}
.verPiensa i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:verPun 1.1s infinite}
.verPiensa i:nth-child(2){animation-delay:.18s}.verPiensa i:nth-child(3){animation-delay:.36s}
@keyframes verPun{40%{opacity:1;transform:translateY(-3px)}}
.verPan{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(500px,calc(100vw - 20px));max-height:calc(var(--vh)*100 - 24px);overflow-y:auto;overscroll-behavior:contain;z-index:8;background:rgba(18,20,28,.93);border:1px solid rgba(255,214,60,.4);border-radius:14px;color:#fff;font:14px Roboto,Arial,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:8px 10px 10px;box-sizing:border-box}
.verCab{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;z-index:2;margin:-8px -10px 4px;padding:8px 10px 4px;background:#12141c;border-radius:14px 14px 0 0}.verCab img.ico{width:26px;height:26px;border-radius:7px}.verCab b{color:#ffd23f}
.verEst{flex:1;font-size:12px;color:#ff8a80}
.verX{background:#2c3140;border:1px solid #555d70;border-radius:50%;color:#ffd23f;width:34px;height:34px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:auto}
.verTutoC{position:relative}.verTutoX{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:1px solid #555d70;background:#2c3140;color:#ffd23f;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:1}.verTutoX svg{width:16px;height:16px}
.verTutoC img.ico{margin-right:36px}.verX svg{width:20px;height:20px}
.verLog{max-height:min(34vh,220px);overflow-y:auto;margin:6px 0;display:flex;flex-direction:column;gap:5px}
.verLog p{margin:0;padding:6px 10px;border-radius:12px;max-width:85%;line-height:1.3;overflow-wrap:anywhere}
.verLog .vU{align-self:flex-end;background:#2f7de1}
.verLog .vV{align-self:flex-start;background:#3a3420;color:#ffe9a3}
.verFila{display:flex;gap:6px}
.verFila input{flex:1;min-width:0;background:rgba(0,0,0,.45);border:1px solid #666;border-radius:10px;color:#fff;padding:9px 10px;font-size:16px}
.verFila button{width:44px;height:42px;border-radius:10px;border:0;background:#3b4252;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.verFila button svg{width:22px;height:22px}
.verFila .verEnv{background:#e8b80c;color:#222}
.verFila .verMic.on{background:#d33;animation:verLate 1s infinite}
.verOpc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12.5px;color:#ccc}
.verOpc label{display:flex;align-items:center;gap:5px;cursor:pointer}
.verOpc button{margin-left:auto;display:flex;align-items:center;gap:4px;background:none;border:1px solid #555;border-radius:8px;color:#ccc;padding:4px 8px;cursor:pointer;font-size:12px}
.verOpc button svg{width:15px;height:15px}
.verIA{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#aab}
.verCerebro{flex:1}.verCerebro.gem{color:#7fd7ff;font-weight:600}
.verIA button,.verIAb button{display:flex;align-items:center;gap:4px;background:none;border:1px solid #555;border-radius:8px;color:#ccc;padding:4px 8px;cursor:pointer;font-size:12px}
.verIA button svg,.verIAb button svg{width:15px;height:15px}
.verIAp{margin-top:6px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05)}
.verIAtx{margin:0 0 6px;font-size:12.5px;line-height:1.35;color:#dde}
.verIAb{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.verTuto{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.verTutoC{width:min(460px,calc(100vw - 24px));box-sizing:border-box;background:#1b1f2a;border:1px solid rgba(255,214,60,.45);border-radius:14px;padding:14px 16px;color:#fff;font:14px Roboto,Arial,sans-serif}
.verTutoC b{display:block;color:#ffd23f;font-size:15px;margin:2px 0 8px}.verTutoC img.ico{width:30px;height:30px;border-radius:8px;float:right}
.verTutoC ol{margin:0 0 10px;padding-left:20px;line-height:1.45}.verTutoC li{margin:4px 0}
.verTutoC a.boton{text-decoration:none;display:inline-flex;align-items:center}
.verIAel{display:block;color:#ffd23f;font-size:13px;margin:0 0 6px}
.verIAs{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}.verIAs button{background:#2c3140;border:1px solid #444b5c;border-radius:999px;color:#eef;padding:5px 10px;font:600 12px Roboto,Arial,sans-serif;cursor:pointer}
.verIAs button.sel{background:#ffd23f;border-color:#ffd23f;color:#1b1f2a}.verIAs button.no{opacity:.45}
#verProv{background:#11141c;border:1px solid #444b5c;border-radius:9px;color:#fff;padding:0 6px;font:13px Roboto,Arial,sans-serif;max-width:40%}
.verMias{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}.verMias span{display:inline-flex;align-items:center;gap:4px;background:#1f3a2a;border:1px solid #2f6b46;border-radius:999px;color:#bff0cf;padding:2px 4px 2px 8px;font-size:12px}
.verMias svg{width:13px;height:13px}.verMias button{background:none;border:0;color:#ddd;cursor:pointer;padding:2px;display:flex}
#verEstado{position:absolute;top:calc(var(--sa-t, 0px) + 74px);right:10px;z-index:4;display:flex;align-items:center;gap:6px;background:rgba(27,31,42,.88);border:1px solid rgba(255,214,60,.55);border-radius:999px;padding:3px 3px 3px 5px;color:#ffe9a3;font:600 13px Roboto,Arial,sans-serif;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#verEstado.oc{display:none}#verEstado img.ico{width:22px;height:22px;border-radius:50%}#verEstado[data-q=crea] span,#verEstado[data-q=piensa] span{animation:verLatido 1.4s ease-in-out infinite}
#verEstado button{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:0;background:#ffd23f;color:#1b1f2a;cursor:pointer;padding:0}#verEstado button svg{width:16px;height:16px}
.verCreaFila{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 7px}
.verCreaFila button,.verCreaTipos button{display:flex;align-items:center;gap:5px;justify-content:center;background:#3a3317;border:1px solid #8a7426;border-radius:9px;color:#ffd23f;padding:6px 4px;font:600 12px Roboto,Arial,sans-serif;cursor:pointer;min-width:0}
.verCreaFila button svg,.verCreaTipos button svg{width:15px;height:15px;flex:none}.verCreaFila button span,.verCreaTipos button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verCreaTipos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 8px}.verCreaTipos button.sel{background:#ffd23f;color:#1b1f2a;border-color:#ffd23f}
#verCreaIn{width:100%;box-sizing:border-box;background:#11141c;border:1px solid #444b5c;border-radius:9px;color:#fff;padding:8px;font:14px Roboto,Arial,sans-serif;resize:vertical;min-height:64px}
.verCreaCam{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:13px;color:#ddd}.verCreaCam[hidden]{display:none}
.verCreaMejor{display:block;margin:6px 0 0;color:#aab;font-size:12px}
.verCreaC [data-c=ok]{background:#ffd23f;color:#1b1f2a;border-color:#ffd23f;font-weight:700}
[data-vcr].ocupado{opacity:.55;pointer-events:none;animation:verLatido 1s ease-in-out infinite}
/* (Verity desactivada: sin sus botones en el creador de mapas ni en el editor de animaciones) */
[data-ea="verity"],[data-cr="verity"],#verBt{display:none!important}
@keyframes verLatido{50%{opacity:.3}}
.crBt.crVer img.ico{width:20px;height:20px;vertical-align:middle}
#edaPan .edaVer{background:#3a3317;border-color:#8a7426;color:#ffd23f}#edaPan .edaVer img.ico{width:18px;height:18px;vertical-align:middle}
.verAnims{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 7px}
.verAnims button{display:flex;align-items:center;gap:5px;justify-content:center;background:#2c3140;border:1px solid #444b5c;border-radius:9px;color:#ffe9a3;padding:6px 4px;font:600 12px Roboto,Arial,sans-serif;cursor:pointer;min-width:0}
.verAnims button svg{width:16px;height:16px;flex:none}.verAnims button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verAnims button:active{background:#e8b80c;color:#222}
#verBt .verOreja{position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:#2f7de1;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
#verBt .verOreja svg{width:13px;height:13px;color:#fff}
#verBt.oido .verOreja{display:flex;animation:verOye 2.4s infinite}
@keyframes verOye{50%{background:#5aa2ff}}
.redondo{width:44px;height:44px;border-radius:50%;background:rgba(40,52,70,.55);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.redondo img{width:26px;height:26px;object-fit:contain}
.redondo small{position:absolute;bottom:-11px;left:0;right:0;text-align:center;font-size:8px;opacity:.85}
#arribaIz{position:absolute;left:10px;top:8px;display:flex;gap:14px}
#arribaDe{position:absolute;right:10px;top:8px;display:flex;gap:14px;align-items:flex-start}
/* cámara libre: L (vuela la cámara) y R (cámara de Roblox), debajo de su botón */
#camLibBtns{display:flex;gap:8px}#camLibBtns.oc{display:none!important}body.tactil #camLibBtns{display:contents}.camLR b{color:#fff;font:700 20px system-ui;line-height:1}.redondo.sel{border-color:#3fa0ff!important;box-shadow:0 0 0 2px #3fa0ff88}
#armaAct{width:56px;text-align:center;font-size:9px}
#armaAct img{width:52px;height:30px;object-fit:contain;background:rgba(40,52,70,.55);border-radius:4px;display:block}
#muni{position:absolute;right:14px;top:62px;font-size:12px;font-weight:bold;text-shadow:0 1px 2px #000}
#barra{position:absolute;right:10px;top:6px;display:flex;gap:4px}
#barra .ra{width:44px;height:40px;background:rgba(40,52,70,.6);border:2px solid transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;pointer-events:auto}
#barra .ra img{width:38px;height:24px;object-fit:contain}
#barra .ra.sel{border-color:#6be06b}
#vida{position:absolute;left:0;bottom:0;width:150px;height:18px;background:#9b1b1b;display:flex;align-items:center;font-size:11px;font-weight:bold}
#vida i{position:absolute;left:0;top:0;bottom:0;background:#e53030}
#vida img{width:14px;height:14px;margin:0 6px;position:relative}
#vida span{position:relative;margin-left:auto;margin-right:8px}
#fps{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:11px;opacity:.75;text-shadow:0 1px 2px #000}
#mira{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.9}
#mira:before,#mira:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}
#mira:before{left:8px;top:2px;width:2px;height:14px}
#mira:after{top:8px;left:2px;height:2px;width:14px}
#aviso{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .3s}
#aviso.ve{opacity:1}
#usarTxt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:13px;text-shadow:0 1px 3px #000}
/* táctil */
#blinterna.sel{background:rgba(255,214,90,.55)!important;border-color:#ffd65a!important}
#tut{position:fixed;inset:0;z-index:40;font-family:Roboto,Arial,sans-serif}#tut.oc{display:none}

#tut .tutHueco.ve{outline:3px solid #4fb3ff;outline-offset:2px;animation:tutLate 1.1s ease-in-out infinite}
@keyframes tutLate{50%{outline-color:#bfe4ff;outline-offset:6px}}
#tut .tutCaja{position:absolute;background:#fff;color:#1c2530;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);box-sizing:border-box;transition:left .28s ease,top .28s ease}
#tut .tutN{font:600 11px Roboto,Arial,sans-serif;color:#6b7785;letter-spacing:.04em}
#tut h3{margin:2px 0 6px;font:700 17px Roboto,Arial,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tut kbd{font:700 12px ui-monospace,Consolas,monospace;background:#eef2f6;border:1px solid #c9d2dc;border-bottom-width:3px;border-radius:6px;padding:2px 7px;color:#2b3542}
#tut p{margin:0 0 10px;font:14px/1.38 Roboto,Arial,sans-serif;color:#33404e}

#tactil{display:none}

/* ---- (Discord) los botones táctiles con el estilo del concepto de GOLDEN («Mejores botones») y la identidad de la 3.0/3.1:
   círculos oscuros y translúcidos con un filo blanco fino, íconos blancos nítidos, el amarillo para lo principal (la mira
   del disparo) y para lo prendido o apretado, los números de MOD y GMod en un globito amarillo y la G de GMod blanca como
   los demás íconos. Cada botón se toca en un área de al menos 44 px (::before con --hit, que pone hud.js) aunque se vea
   más chico. Vale para las dos disposiciones (la nueva y la guardada de antes): lo que cambia de lugar es sólo la nueva ---- */

body.tactil #hud [data-btn=camLibre].sel,body.tactil #hud .camLR.sel,body.tactil #tactil #brotar.on,body.tactil #tactil #bvolver.on,body.tactil #hud .modmBt.on,body.tactil #hud .gmbBt.on{

/* las medidas salen de Oswald (alto 1,19 em, bajo 0,29, mayúscula 0,81): «JX» con la mayúscula a media placa, STUDIOS al
   30 % y las dos centradas en la placa (-0,045 em: la mayúscula queda un poco abajo del medio del renglón). STUDIOS con
   0,3 em entre letras mide 1,828 placas: la marca entera, 3,03, y al empezar se corre la mitad de lo que queda a la derecha
   de la placa (1,014) para que la placa sola quede en el medio */
#intro .inSale,#intro .inMarca{display:flex;align-items:center;flex:none}
#intro .inMarca{transform:translateX(calc(var(--S)*1.014))}
#intro .inPlaca{position:relative;width:var(--S);height:var(--S);overflow:hidden;flex:none}
#intro .inPlaca>i,#intro .inPlaca>i>i{position:absolute;inset:0}
#intro .inPlaca>i{transform:scaleY(0)}#intro .inPlaca>i>i{background:#f2b31b;transform:scaleX(.12)}
#intro .inPlaca b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 calc(var(--S)*.617)/1 'JX Oswald','Roboto Condensed','Arial Narrow',sans-serif;color:#121212;transform:translateY(calc(100% - .045em))}
#intro .inTxt{overflow:hidden;padding:0 calc(var(--S)*.8) 0 var(--g);margin-inline-end:calc(var(--S)*-.8)}
#intro .inLetras{display:flex;font:300 calc(var(--S)*.37)/1.3 'JX Oswald','Roboto Condensed','Arial Narrow',sans-serif;color:#efede7;letter-spacing:.3em;transform:translateX(calc(-100% - var(--g) - 2.1em))}
#intro .inLetras i{display:block;font-style:normal;transform:translateY(-.045em)}#intro .inLetras i:last-child{letter-spacing:0}
#intro .inLetras i:nth-child(2){--i:1}#intro .inLetras i:nth-child(3){--i:2}#intro .inLetras i:nth-child(4){--i:3}#intro .inLetras i:nth-child(5){--i:4}#intro .inLetras i:nth-child(6){--i:5}#intro .inLetras i:nth-child(7){--i:6}
/* (los tiempos: ver el script de la intro; curvas: salida exponencial para lo que aparece, suave a los dos lados para lo que se corre) */
#intro.va .inPlaca>i{animation:inAlto .22s cubic-bezier(.16,1,.3,1) .08s both}
#intro.va .inPlaca>i>i{animation:inAncho .24s cubic-bezier(.16,1,.3,1) .22s both}
#intro.va .inPlaca b{animation:inJX .3s cubic-bezier(.16,1,.3,1) .34s both}
#intro.va .inMarca{animation:inCorre .42s cubic-bezier(.65,0,.35,1) .46s both}
#intro.va .inLetras{animation:inSalen .45s cubic-bezier(.16,1,.3,1) .5s both}
#intro.va .inLetras i{animation:inJunta .84s cubic-bezier(.16,1,.3,1) .46s both}
#intro.va .inSale{animation:inSale .34s cubic-bezier(.65,0,.35,1) 1.36s both}
@keyframes inAlto{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes inAncho{from{transform:scaleX(.12)}to{transform:scaleX(1)}}
@keyframes inJX{from{transform:translateY(calc(100% - .045em))}to{transform:translateY(-.045em)}}
@keyframes inCorre{from{transform:translateX(calc(var(--S)*1.014))}to{transform:translateX(0)}}
@keyframes inSalen{from{transform:translateX(calc(-100% - var(--g) - 2.1em))}to{transform:translateX(0)}}
@keyframes inJunta{from{transform:translateX(calc(var(--i,0)*.3em)) translateY(-.045em)}to{transform:translateX(0) translateY(-.045em)}}
@keyframes inSale{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(calc(var(--S)*-.06))}}
@keyframes inQuieta{0%{opacity:0}17%{opacity:1}74%{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #intro .inMarca,#intro .inPlaca>i,#intro .inPlaca>i>i,#intro .inLetras,#intro.va .inMarca,#intro.va .inPlaca>i,#intro.va .inPlaca>i>i,#intro.va .inLetras{animation:none;transform:none}
  #intro .inPlaca b,#intro.va .inPlaca b,#intro .inLetras i,#intro.va .inLetras i{animation:none;transform:translateY(-.045em)}
  #intro .inSale{opacity:0}#intro.va .inSale{animation:inQuieta 1.15s linear both}#intro.va{animation-delay:1.15s}}

/* las capas (ui.js, capasRevisar): con un menú grande abierto (la pausa, Ajustes, Controles, Personajes, el spawn, los
   emotes, el inicio, el editor de botones, un diálogo) lo que flota sobre el juego queda debajo y escondido: el celular
   (en la mano o el de las apps), la ruleta de emotes, el panel GMod, el menú MOD, el chat, Verity, el arma en la mano y
   el cartel de «juntos» (la cola de descargas no: en el inicio se sigue viendo; va en la capa 5, debajo de la pausa). La causa del celular encima de la pausa (Discord, Kris): la regla era
   «body:has(.panel:not(.oc)) #celular,#celular.tapado»; un navegador sin :has() (WebView viejos de Android, Safari antes
   de 15.4) tira la regla ENTERA, también lo de .tapado, así que no se escondía nunca. Ahora no hay :has() en el CSS y el
   celular además va en la capa 5, debajo de los paneles (6) */

/* menú de pausa (concepto de la comunidad): grilla de tarjetas con ícono, Seguir arriba, Borrar todo en rojo. La forma; desde la
   3.0 va oscuro, con placas y el amarillo del menú principal (las reglas #pausa del final) */
#pausa{background:rgba(8,10,14,.42)}
#pausa .pzCaja{background:#fff;color:#1d2230;border-radius:10px;padding:0;width:min(600px,calc(var(--vw)*94));max-height:calc(var(--vh)*94);overflow:auto;box-shadow:0 10px 34px rgba(0,0,0,.35);font-family:Roboto,'Helvetica Neue',Arial,sans-serif}

.pzTit{display:flex;align-items:center;gap:7px;font-size:18px}.pzTit .gli{stroke-width:3.2;width:16px;height:16px}

.pzX{margin-left:auto;width:30px;height:30px;border-radius:7px;border:1px solid #d9dce1;background:#fff;color:#333;display:flex;align-items:center;justify-content:center;cursor:pointer}

.pzSeguir:active,.pzTar:active,.pzSalir:active,.pzChico:active{transform:translateY(1px);filter:brightness(.96)}
.pzGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}

/* menú principal 3.0: placas rectas y planas (sin brillos, degradados de adorno ni bordes redondeados), letra condensada
   en mayúsculas (Oswald, va adentro del HTML: se ve igual en todos los celulares) y un solo color de acento, el amarillo
   de advertencia, para lo que importa: «Empezar partida nueva» y el botón que tocás. La versión en una placa abajo a la
   derecha. Todo alineado al mismo borde que el recuadro del logo (--jxM) */
@font-face{font-family:'JX Oswald';src:url(data:font/woff2;base64,/*FUENTEOSWALD*/) format('woff2');font-weight:200 700;font-display:block}
#rbInicio{--jxA:#f2b31b;--jxA2:#ffc531;--jxT:#efede7;--jxP:rgba(12,13,15,.85);--jxP2:rgba(26,27,30,.94);--jxF:'JX Oswald','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Roboto,Arial,sans-serif;
  --jxM:calc(var(--vh)*5);--jxLh:clamp(40px,calc(var(--vh)*18.5),150px);--jxCh:max(30px,calc(var(--vh)*7.4))}
@media (max-height:440px){#rbInicio{--jxLh:calc(var(--vh)*15)}#rbInicio .rbLogo{top:calc(var(--vh)*3)}}   /* (celular apaisado: logo un poco más chico, más aire para la lista) */
#rbInicio .rbSombra{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 50%)}
/* (el logo tiene un borde de sombra transparente: se corre para que su recuadro quede en la misma línea que las placas) */
#rbInicio .rbLogo{inset-inline-start:var(--jxM);height:var(--jxLh);margin-inline-start:calc(var(--jxLh)*-.09)}
#rbInicio .rbLista{inset-inline-start:var(--jxM);max-width:calc(100% - var(--jxM)*2);gap:calc(var(--vh)*.6*var(--rbK,1));align-items:stretch}
#rbInicio .rbIt{font:500 calc(var(--vh)*4.3*var(--rbK,1))/1.1 var(--jxF);text-transform:uppercase;letter-spacing:.02em;color:var(--jxT);text-shadow:none;background:var(--jxP);
  padding:calc(var(--vh)*1.05*var(--rbK,1)) calc(var(--vh)*4) calc(var(--vh)*1.05*var(--rbK,1)) calc(var(--vh)*2.2);border-inline-start:calc(var(--vh)*.7) solid transparent;transform:none;transition:none}
#rbInicio .rbIt:hover{border-inline-start-color:var(--jxA);background:var(--jxP2);color:#fff;transform:none;text-shadow:none}
#rbInicio .rbIt:active,#rbInicio .rbIt.rbPri{background:var(--jxA);border-inline-start-color:var(--jxA);color:#121212}
#rbInicio .rbIt.rbPri{font-weight:600}#rbInicio .rbIt.rbPri:hover{background:var(--jxA2);border-inline-start-color:var(--jxA2)}
#rbInicio .rbIt:focus-visible,#rbInicio .rbChipG:focus-visible{outline:2px solid var(--jxA);outline-offset:-2px}
#rbInicio .rbSep{height:calc(var(--vh)*1.4*var(--rbK,1));flex:none}
#rbInicio .rbLista.rbDesliza{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}#rbInicio .rbLista .rbIt{flex:none}
#rbInicio .rbAbajo{inset-inline-start:var(--jxM);bottom:calc(var(--vh)*3);gap:calc(var(--vh)*.6)}
#rbInicio .rbChipG{box-sizing:border-box;height:var(--jxCh);border:0;border-radius:0;background:var(--jxP);box-shadow:none;font:500 max(12px,calc(var(--vh)*2.9))/1 var(--jxF);text-transform:uppercase;letter-spacing:.03em;color:var(--jxT);padding:0 calc(var(--vh)*1.8);gap:calc(var(--vh)*1.1);white-space:nowrap}
#rbInicio .rbChipG:hover{background:var(--jxP2)}
#rbInicio .rbChipG:active{background:var(--jxA);color:#121212;filter:none}
#rbInicio .rbChipG .gli{width:1.25em;height:1.25em;flex:none}
#rbInicio .rbChipG input{font:500 max(12px,calc(var(--vh)*2.9))/1 var(--jxF);height:100%;padding:0;color:inherit;width:calc(var(--vh)*20)}
#rbInicio .rbChipG.rbRed{padding:0;width:var(--jxCh);justify-content:center}#rbInicio .rbChipG.rbRed svg{width:1.3em;height:1.3em}
#rbInicio .rbVer{inset-inline-end:var(--jxM);bottom:calc(var(--vh)*3);box-sizing:border-box;height:var(--jxCh);display:flex;align-items:center;gap:.7em;padding:0 calc(var(--vh)*1.8);background:var(--jxP);
  font:500 max(12px,calc(var(--vh)*2.9))/1 var(--jxF);text-transform:uppercase;letter-spacing:.05em;color:var(--jxT);text-shadow:none;opacity:1;white-space:nowrap;direction:ltr}
#rbInicio[dir=rtl] .rbVer{right:auto;left:var(--jxM)}   /* (la versión se lee igual en árabe, del otro lado) */
#rbInicio .rbVer b{color:var(--jxA);font-weight:600;margin-inline-start:-.35em}#rbInicio .rbVer i{font-style:normal;color:rgba(239,237,231,.5)}
/* ---- 3.0: los otros menús con la identidad del principal (pedido: «cambiar esos menús de mapas, de juego y de pausa a
   algo más original… no hay que darle identidad de hyper sandbox»). Las mismas reglas que el menú principal: placas
   rectas y planas (sin bordes redondeados, brillos ni degradados), Oswald en mayúsculas para lo que es interfaz (Roboto
   para los nombres de las cosas, que pueden ser largos), el amarillo sólo para lo principal y lo elegido, y como firma la
   placa amarilla de la intro: el filo amarillo al costado del título de cada menú. Objetivos táctiles de 40 px o más y
   textos con contraste ≥ 4,5 (los grises sobre las placas oscuras, ≥ 7) ---- */
:root{--jxA:#f2b31b;--jxA2:#ffc531;--jxT:#efede7;--jxT2:#aeaca6;--jxT3:#8f8d88;--jxF:'JX Oswald','Roboto Condensed',sans-serif-condensed,'Arial Narrow',Roboto,Arial,sans-serif;
  --jxFo:rgba(12,13,15,.96);--jxPl:#1b1c1f;--jxPl2:#26272b;--jxPl3:#313237;--jxLin:rgba(239,237,231,.12);--jxRo:#ff6b5e}

/* -- pausa: las mismas tarjetas con ícono (U1), ahora placas oscuras; Seguir es la placa amarilla, como «Empezar partida
   nueva»; el título lleva la placa amarilla con el ícono de pausa en la esquina, como la marca de la intro -- */
#pausa{background:rgba(5,6,8,.55)}
#pausa .pzCaja{background:var(--jxFo);color:var(--jxT);border:1px solid var(--jxLin);border-radius:0;box-shadow:none;width:min(620px,calc(var(--vw)*94))}
#pausa .pzCab{padding:0 12px 0 0;gap:14px;min-height:52px}
#pausa .pzTit{font:600 24px/1 var(--jxF);text-transform:uppercase;letter-spacing:.03em;gap:14px;align-self:stretch;align-items:center;min-width:0}
#pausa .pzTit i{flex:none;align-self:stretch;width:52px;display:flex;align-items:center;justify-content:center;background:var(--jxA);color:#121212}
#pausa .pzTit .gli{width:18px;height:18px;stroke-width:3.2}
#pausa .pzTit b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.3}
#pausa .pzModo{white-space:nowrap;font:500 12px/1.3 var(--jxF);text-transform:uppercase;letter-spacing:.08em;color:var(--jxT2);background:none;border:1px solid var(--jxLin);border-radius:0;padding:3px 8px;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pausa .pzX{flex:none;width:40px;height:40px;border:0;border-radius:0;background:var(--jxPl2);color:var(--jxT)}
#pausa .pzX:hover,#pausa .pzX:focus-visible{background:var(--jxA);color:#121212}
#pausa .pzSeguir{justify-content:flex-start;gap:14px;width:calc(100% - 28px);height:52px;margin:12px 14px 8px;padding:0 18px;border:0;border-radius:0;background:var(--jxA);color:#121212;box-shadow:none;font:600 20px/1 var(--jxF);text-transform:uppercase;letter-spacing:.05em}
#pausa .pzSeguir .gli{fill:#121212;stroke:#121212;width:16px;height:16px}
#pausa .pzSeguir:hover,#pausa .pzSeguir:focus-visible{background:var(--jxA2);outline:0}
#pausa .pzGrid{gap:6px;padding:0 14px 14px}
#pausa .pzTar{align-items:flex-start;justify-content:flex-start;gap:0;min-height:92px;padding:12px 12px 11px 13px;background:var(--jxPl);border:0;border-inline-start:3px solid transparent;border-radius:0;color:var(--jxT);text-align:start;min-width:0}
#pausa .pzTar i{width:auto;height:auto;margin:0 0 6px;border-radius:0;background:none;color:var(--jxT2)}
#pausa .pzTar .gli{width:22px;height:22px}
#pausa .pzTar b{margin-top:auto;font:500 16px/1.3 var(--jxF);text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pausa .pzTar small{font:400 12px/1.35 Roboto,Arial,sans-serif;color:var(--jxT2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pausa .pzTar:hover,#pausa .pzTar:focus-visible{background:var(--jxPl2);border-inline-start-color:var(--jxA);outline:0}
#pausa .pzTar:hover i,#pausa .pzTar:focus-visible i{color:var(--jxA)}
#pausa .pzTar:active,#pausa .pzSeguir:active,#pausa .pzSalir:active,#pausa .pzChico:active{transform:none;filter:none}
#pausa .pzTar:active{background:var(--jxPl3)}
#pausa .pzTar.pzRojo{background:var(--jxPl);border-color:transparent;--jxRo:#ff8a7e}#pausa .pzTar.pzRojo i,#pausa .pzTar.pzRojo b{color:var(--jxRo)}#pausa .pzTar.pzRojo small{color:var(--jxT2)}
#pausa .pzTar.pzRojo:hover,#pausa .pzTar.pzRojo:focus-visible{border-inline-start-color:var(--jxRo)}
#pausa .pzTar.pzRojo[data-conf]{background:#b8382e;border-inline-start-color:#fff}#pausa .pzTar.pzRojo[data-conf] i,#pausa .pzTar.pzRojo[data-conf] b,#pausa .pzTar.pzRojo[data-conf] small{color:#fff}
#pausa .pzPie{gap:6px;padding:10px 14px;background:transparent;border-top:1px solid var(--jxLin);border-radius:0}
#pausa .pzSalir,#pausa .pzChico{height:40px;padding:0 14px;gap:8px;border:0;border-radius:0;background:var(--jxPl2);color:var(--jxT);font:500 14px/1 var(--jxF);text-transform:uppercase;letter-spacing:.05em}
#pausa .pzSalir:hover,#pausa .pzChico:hover{background:var(--jxPl3)}#pausa .pzSalir:hover{box-shadow:inset 3px 0 0 var(--jxA)}
#pausa .pzChico .gli,#pausa .pzSalir .gli{width:16px;height:16px}
#pausa .pzFps{font:500 12px/1 var(--jxF);letter-spacing:.08em;text-transform:uppercase;color:var(--jxT3)}
@media (max-width:520px){#pausa .pzGrid{grid-template-columns:repeat(2,1fr)}}
/* (con el celular parado el juego está girado y las media queries miran el aparato: el ancho del juego es el alto del
   aparato —nunca angosto— y el alto del juego, el ancho del aparato; por eso cada regla de «bajo» va también como
   html.rot dentro de max-width) */

   amarillo de acento; pestañas en placas (la elegida, amarilla); las categorías en una columna a la izquierda; el
   buscador, el orden y Explorar/Instalados arriba de la grilla; tarjetas con la imagen sobre una placa, el nombre, una
   línea de datos y el botón a lo ancho (amarillo: lo que se puede hacer; verde con contorno: ya está); títulos de sección

<script>
// el giro con el celular parado: va primero y es chico (antes iba en el script de la pantalla de carga, que trae adentro
// las fotos de fondo —~0,9 MB—, y con internet lento la intro arrancaba tarde y sin girar). Con el celular parado se gira
// todo 90° desde el primer cuadro, igual que hace el juego cuando arranca (la pantalla de carga y la intro también); las
// medidas, por la pantalla girada (--vw, --vh, y bajo/angosto para la carga)
(function () {
  var COARSE0 = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  function girar0() {
    var rot = COARSE0 && innerHeight > innerWidth * 1.05 && !/[?&]sinGiro\b/.test(location.search), b = document.body.style, r = document.documentElement.style;
    document.documentElement.classList.toggle('rot', rot);
    if (rot) { b.width = innerHeight + 'px'; b.height = innerWidth + 'px'; } else { b.width = ''; b.height = ''; }
    var vw = rot ? innerHeight : innerWidth, vh = rot ? innerWidth : innerHeight, c = document.getElementById('carga');
    r.setProperty('--vw', vw / 100 + 'px'); r.setProperty('--vh', vh / 100 + 'px');
    if (c) { c.classList.toggle('bajo', vh <= 460); c.classList.toggle('angosto', vw <= 640); }
  }
  girar0(); addEventListener('resize', girar0); addEventListener('orientationchange', function () { setTimeout(girar0, 60); });
})();
</script>
<script>
// La intro de JXStudios: procedural, sin video ni imágenes (unas líneas de CSS), corta y con el idioma del menú 3.0 —la
// placa amarilla de «Empezar partida nueva» y la letra condensada del menú (Oswald, que ya va adentro del HTML)—:
//   0,08 s  aparece el filo amarillo (el mismo borde que marca el botón elegido en el menú) y se abre en la placa
//   0,34 s  sube «JX», en negro, adentro de la placa
//   0,46 s  la placa se corre a la izquierda y STUDIOS sale de atrás de ella, con las letras que se van juntando
//   1,36 s  todo se funde a negro; 1,70 s termina (I.fin)
// Después, el menú; o la pantalla de carga, si el juego sigue bajando. Si el juego ya había cargado, la carga no se asoma
// en el medio: se va entera junto con la intro (el menú queda a ~2,25 s del primer cuadro). Se saltea con un toque, un clic
// o cualquier tecla. Todo se mueve con animaciones de CSS de sólo transform y opacity: las dibuja el compositor, sin
// JavaScript por cuadro, y siguen suaves aunque el juego esté compilando (con un lienzo y requestAnimationFrame la intro
// se trababa hasta 0,8 s mientras arrancaba el juego). Va antes del script de la carga (que trae las fotos): arranca con
// los primeros ~270 KB del HTML. Con el celular parado se ve derecha dentro de la página girada; con «reducir movimiento»
// del sistema, la marca quieta con un fundido. Para las pruebas deja en __intro cuándo empezó y terminó y cómo se salteó.
(function () {
  var c = document.getElementById('carga'), el = document.getElementById('intro'), I = window.__intro = { fin: false };
  if (!el || /[?&]test\b/.test(location.search)) { I.fin = true; if (c) c.classList.add('introFin'); return; }      // (en las pruebas, sin intro)
  var QUIETA = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), DUR = QUIETA ? 1.15 : 1.7;
  var tPedida = performance.now(), tSeg = setTimeout(fin, (DUR + 3) * 1000);   // (por si la pestaña no dibuja)
  I.dur = DUR; I.quieta = QUIETA;
  function fuenteOk() { try { return document.fonts.check("600 20px 'JX Oswald'") && document.fonts.check("300 20px 'JX Oswald'"); } catch (e) { return true; } }
  try { document.fonts.load("600 20px 'JX Oswald'"); document.fonts.load("300 20px 'JX Oswald'"); } catch (e) {}
  function tecla() { saltar('tecla'); }
  function saltar(como) { if (!I.fin) { I.salto = como; fin(); } }
  function fin() {
    if (I.fin) return; I.fin = true; I.tFin = I.t0 ? +((performance.now() - I.t0) / 1000).toFixed(3) : 0;
    removeEventListener('keydown', tecla, true); clearTimeout(tSeg);
    // (si el juego ya cargó, W.fin estaba esperando: la carga se esconde y se va todo junto al menú)
    if (I.cb) { var f = I.cb; I.cb = null; c.classList.add('introDirecto', 'introFin'); f(); } else c.classList.add('introFin');
    setTimeout(function () { el.style.display = 'none'; }, 450);   // (después del fundido, sin capas de más)
  }
  el.addEventListener('pointerdown', function () { saltar('toque'); });
  addEventListener('keydown', tecla, true);
  el.addEventListener('animationend', function (e) { if (e.animationName === 'inSale' || e.animationName === 'inQuieta') fin(); });
  // arranca cuando la letra del menú está lista (va adentro del HTML: unos milisegundos) o a los 0,35 s con la de reserva
  (function empezar() {
    if (I.fin) return;
    if (!fuenteOk() && performance.now() - tPedida < 350) { setTimeout(empezar, 16); return; }
    el.classList.add('va'); I.t0 = performance.now(); clearTimeout(tSeg); tSeg = setTimeout(fin, (DUR + 1.5) * 1000);
    // (el momento justo en que el compositor arrancó las animaciones, si el navegador lo dice)
    I.inicio = +(I.t0 / 1000).toFixed(3);
    try { var a = el.getAnimations({ subtree: true })[0]; if (a && a.ready) a.ready.then(function () { if (a.startTime != null && !I.fin) { I.t0 = a.startTime; I.inicio = +(I.t0 / 1000).toFixed(3); } }); } catch (e) {}
  })();
})();
</script>
