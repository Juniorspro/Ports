# tienda de JXMod: wrangler deploy (con CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el entorno)
name = "rezobox-tienda"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
# (las variables puestas en el panel de Cloudflare no se borran al desplegar desde GitHub)
keep_vars = true

# el ID de cliente de OAuth de Google (no es secreto: lo ve cualquiera en la página de entrada). Con esto se pide iniciar
# sesión para el multijugador, el progreso y lo social; sin él, todo anda como antes
[vars]
GOOGLE_CLIENT_ID = "586582296574-f3ghv0j0pvd93bhrs0vasequ4qejo2g1.apps.googleusercontent.com"
# Stickerazo (/sz): el mismo cliente (su origen está autorizado). Con esto entrar con Google es obligatorio para la comunidad
SZ_GOOGLE_CLIENT_ID = "586582296574-f3ghv0j0pvd93bhrs0vasequ4qejo2g1.apps.googleusercontent.com"
# Stickerazo Premium y donaciones (PayPal, de verdad). El secreto va aparte: wrangler secret put SZ_PAYPAL_SECRET
SZ_PAYPAL_CLIENT_ID = "BAA38c-QSfU6Rvib2LkIJ2r3TmlHoYUc52WqtmUJ4ANksZaK0Rcdnkjks43eUMKQxIrhi3t753MYvN-qac"
SZ_PAYPAL_PLAN_MES = "P-3MH40762X19345919NMATCUY"
SZ_PAYPAL_PLAN_ANIO = "P-6KT390991W1127604NMATCUY"
SZ_PAYPAL_MODO = "live"
# el bot de Discord (discord.js): la aplicación «JXBot». El ID y la clave pública no son secretos (la clave sólo sirve para
# comprobar que los pedidos vienen de Discord); el token y el código de admin van como secretos
DISCORD_APP_ID = "1573885959752253521"
DISCORD_PUBLIC_KEY = "cd809ee1c5327d141d9cd636a1355ce0d77668bffd170ead0c29cae0726abd80"

[[d1_databases]]
binding = "DB"
database_name = "rezobox-tienda"
database_id = "b4464be7-c6c5-4bcd-aec1-ecea2765d0fa"

# Stickerazo: los packs que cada cuenta guarda (su propia base, así no llena la de la comunidad)
[[d1_databases]]
binding = "SZ_NUBE"
database_name = "stickerazo-nube"
database_id = "c3327f7e-112b-4d3e-8ed5-128ada938e85"

# Verity (la compañera con IA del juego): modelo de lenguaje y voz de Workers AI
[ai]
binding = "AI"

# el bot de Discord de JXApps (discord.js): cada 10 minutos avisa las versiones nuevas y las respuestas del panel.
# DISCORD_APP_ID y DISCORD_PUBLIC_KEY van en [vars] cuando exista la aplicación de Discord; el token, como secreto:
# wrangler secret put DISCORD_TOKEN
[triggers]
crons = ["*/10 * * * *"]

# la puerta de JXBot (discord_puerta.js): un Durable Object que mantiene abierta la conexión con Discord para leer los
# mensajes privados, los «/JB …» y las menciones, y contestar con la IA
[[durable_objects.bindings]]
name = "DC_PUERTA"
class_name = "PuertaJX"

[[migrations]]
tag = "puerta-1"
new_sqlite_classes = ["PuertaDiscord"]

# (la primera puerta seguía corriendo código viejo después de subir el nuevo: se renombra —eso la obliga a reiniciarse con
# el código nuevo— y desde ahora se reinicia sola cuando el Worker le avisa que hay otra versión)
[[migrations]]
tag = "puerta-2"
renamed_classes = [{ from = "PuertaDiscord", to = "PuertaJX" }]

# la versión subida (la puerta la compara con la suya)
[version_metadata]
binding = "CF_VERSION_METADATA"
