[package]
name = "jxmotor-android"
version = "0.1.0"
edition = "2021"
description = "JX Motor en Android: libjxmotor.so (JNI, hilo de dibujo con wgpu —Vulkan o GLES— sobre la superficie que está atrás del WebView)"

[lib]
name = "jxmotor"
crate-type = ["cdylib"]

[dependencies]
jxmotor = { path = "../jxmotor" }
wgpu = "30"
raw-window-handle = "0.6"
