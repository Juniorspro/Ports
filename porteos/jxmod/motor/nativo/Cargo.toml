[package]
name = "jxmod-nativo"
version = "0.1.0"
edition = "2021"
description = "JXMod nativo: la app de Android en Rust, sin WebView (NativeActivity). Motores: Vulkan, OpenGL 3, OpenGL 2"

[lib]
name = "jxmod"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
jxmotor = { path = "../jxmotor", features = ["vk"] }
jxjuego = { path = "../juego" }
# (los addons de GMod: la capa de la web en Rust, gmod_juego.rs)
jxgmod = { path = "../gmod" }
glow = "0.16"
png = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
# (el multijugador: TLS y HTTPS de Java por JNI, src/red_android.rs; ya estaba en Cargo.lock por android-activity)
jni = "0.22"
