[package]
name = "jxjuego"
version = "0.1.0"
edition = "2021"
description = "JXMod nativo: el juego en Rust (lee el paquete del juego, arma los mapas; después la física, los NPC, las armas, los menús)"

[lib]
crate-type = ["rlib"]

[dependencies]
jxmotor = { path = "../jxmotor" }
serde_json = "1"
flate2 = "1"
image-webp = "0.2"
