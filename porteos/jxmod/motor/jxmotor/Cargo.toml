[package]
name = "jxmotor"
version = "0.1.0"
edition = "2021"
description = "JX Motor: dibujo nativo de JXMod (GLES 3)"

[lib]
crate-type = ["rlib"]

[dependencies]
glow = "0.16"
wgpu = "30"
bytemuck = "1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ash = { version = "0.38", optional = true }

[features]
default = []
# el motor Vulkan propio (vk.rs, con ash): sin wgpu
vk = ["dep:ash"]

[build-dependencies]
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
