[package]
name = "personajes-prueba"
version = "0.1.0"
edition = "2021"
publish = false
description = "JXMod nativo: las pruebas de los personajes (jxjuego::personaje): fotos con el motor GLES fuera de pantalla y la comparación con la web"

[dependencies]
jxjuego = { path = "../juego" }
jxmotor = { path = "../jxmotor" }
serde_json = "1"
glow = "0.16"
png = "0.17"
khronos-egl = { version = "6", features = ["dynamic"] }
