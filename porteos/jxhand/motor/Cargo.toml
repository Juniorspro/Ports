[package]
name = "jxhand"
version = "0.1.0"
edition = "2021"
description = "JX Hand Engine: seguimiento de manos con los modelos de MediaPipe, en Rust puro (nativo y WebAssembly)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# la puerta JNI también en la PC (para probarla con Java sin un celular)
jni = ["gl"]
# el dibujo con OpenGL ES también en la PC (Mesa), para probarlo
gl = []

[dependencies]
